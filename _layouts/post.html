---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%-m月%-d日" }}</time>
    </p>
    {% include post-terms.html post=page %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  {% include comments.html %}
</article>
